# =============================================================================
# GuOnco Registry — Data Dictionary (SOURCE OF TRUTH)
# =============================================================================
# This file is the single source of truth for:
#   - SQLite schema (generated by src/schema.py)
#   - UI forms (rendered by web/app.js)
#   - AI extraction prompt constraints (src/extract.py)
#   - Validation layer (Pydantic models)
#   - Google Sheets column headers (scripts/setup_apps_script.py)
#
# Rules:
#   - All stored values are language-neutral CODES (never display strings).
#   - Every field and option carries label_es + label_en for dual-label UI.
#   - Ported verbatim from registroonco js/templates.js + 4 approved additions
#     (ecog, tabaquismo in all; cis_asociado in vejiga/ureter;
#      forma_presentacion in rinon).
#   - Do NOT hand-edit src/schema.py — regenerate it from this file.
# =============================================================================

meta:
  version: "0.1.0"
  name_es: "Registro GU Onco"
  name_en: "GU Onco Registry"
  dictation_languages: [es-CO, en-US]
  ui_languages: [es, en]
  storage:
    primary: sqlite          # local source of truth
    backup: google_sheets    # via Apps Script web app, one sheet per pathology

# -----------------------------------------------------------------------------
# Common fields: spread into every pathology template (like CAMPOS_COMUNES)
# -----------------------------------------------------------------------------
common_fields:

  - id: historia_clinica
    group: paciente
    code: MRN
    type: text
    required: true
    label_es: "ID / Historia clínica"
    label_en: "ID / Medical record"

  - id: nombre
    group: paciente
    code: NAME
    type: text
    required: false
    label_es: "Nombre completo"
    label_en: "Full name"

  - id: fecha_nacimiento
    group: paciente
    code: DOB
    type: date
    required: false
    label_es: "Fecha de nacimiento"
    label_en: "Date of birth"

  - id: edad
    group: paciente
    code: AGE_DX
    type: number
    unit: years
    required: false
    label_es: "Edad al diagnóstico"
    label_en: "Age at diagnosis"

  - id: sexo
    group: paciente
    code: SEX
    type: select
    required: false
    label_es: "Sexo"
    label_en: "Sex"
    options:
      - {code: MASCULINO, es: "Masculino", en: "Male"}
      - {code: FEMENINO,  es: "Femenino",  en: "Female"}

  - id: institucion
    group: paciente
    code: INSTITUTION
    type: text
    required: false
    label_es: "Institución"
    label_en: "Institution"

  - id: medico
    group: paciente
    code: PHYSICIAN
    type: text
    required: false
    label_es: "Médico tratante"
    label_en: "Treating physician"

  - id: fecha_registro
    group: paciente
    code: REG_DATE
    type: date
    auto: today            # prefilled by app, editable
    required: true
    label_es: "Fecha de registro"
    label_en: "Registry date"

  # ---- Approved addition #1: universal performance status -------------------
  - id: ecog
    group: paciente
    code: ECOG_PS
    type: select
    required: false
    label_es: "ECOG Performance Status"
    label_en: "ECOG Performance Status"
    options:
      - {code: ECOG_0, es: "0 — Asintomático", en: "0 — Asymptomatic"}
      - {code: ECOG_1, es: "1 — Sintomático, ambulatorio", en: "1 — Symptomatic, ambulatory"}
      - {code: ECOG_2, es: "2 — En cama <50% del día", en: "2 — In bed <50% of day"}
      - {code: ECOG_3, es: "3 — En cama >50% del día", en: "3 — In bed >50% of day"}
      - {code: ECOG_4, es: "4 — Confinado a cama", en: "4 — Bedbound"}
      - {code: ECOG_5, es: "5 — Fallecido", en: "5 — Dead"}

  # ---- Approved addition #2: smoking status ----------------------------------
  - id: tabaquismo
    group: paciente
    code: SMOKING
    type: select
    required: false
    label_es: "Tabaquismo"
    label_en: "Smoking status"
    options:
      - {code: NUNCA,      es: "Nunca",       en: "Never"}
      - {code: EX_FUMADOR, es: "Ex-fumador",  en: "Former smoker"}
      - {code: ACTIVO,     es: "Activo",      en: "Current smoker"}

# Shared field fragments referenced by several pathologies (YAML anchors).
_shared:
  fecha_diagnostico: &fecha_diagnostico
    id: fecha_diagnostico
    group: diagnostico
    code: DX_DATE
    type: date
    required: false
    label_es: "Fecha diagnóstico"
    label_en: "Date of diagnosis"

  fecha_procedimiento: &fecha_procedimiento
    id: fecha_procedimiento
    group: tratamiento
    code: PROC_DATE
    type: date
    required: false
    label_es: "Fecha procedimiento"
    label_en: "Procedure date"

  proximo_seguimiento: &proximo_seguimiento
    id: proximo_seguimiento
    group: seguimiento
    code: NEXT_FU
    type: date
    required: false
    label_es: "Próximo seguimiento"
    label_en: "Next follow-up"

  observaciones: &observaciones
    id: observaciones
    group: seguimiento
    code: NOTES
    type: textarea
    required: false
    label_es: "Observaciones"
    label_en: "Notes"

  lateralidad: &lateralidad
    id: lateralidad
    group: diagnostico
    code: LATERALITY
    type: select
    required: false
    label_es: "Lateralidad"
    label_en: "Laterality"
    options:
      - {code: DERECHO,   es: "Derecho",   en: "Right"}
      - {code: IZQUIERDO, es: "Izquierdo", en: "Left"}
      - {code: BILATERAL, es: "Bilateral", en: "Bilateral"}

  tamano: &tamano
    id: tamano
    group: diagnostico
    code: TUMOR_SIZE
    type: number
    unit: cm
    required: false
    label_es: "Tamaño tumor (cm)"
    label_en: "Tumor size (cm)"

# -----------------------------------------------------------------------------
# Pathologies (one SQLite table / one Google Sheet per entry)
# -----------------------------------------------------------------------------
pathologies:

  # ===========================================================================
  prostata:
    nombre_es: "Cáncer de Próstata"
    nombre_en: "Prostate Cancer"
    cie10: C61
    color: "#2980b9"
    fields:
      - *fecha_diagnostico
      - id: psa_diagnostico
        group: diagnostico
        code: PSA_DX
        type: number
        unit: ng/mL
        required: false
        label_es: "PSA al diagnóstico (ng/mL)"
        label_en: "PSA at diagnosis (ng/mL)"
      - id: histologia
        group: diagnostico
        code: HISTOLOGY
        type: select
        required: false
        label_es: "Histología"
        label_en: "Histology"
        options:
          - {code: ADENO_ACINAR,     es: "Adenocarcinoma acinar", en: "Acinar adenocarcinoma"}
          - {code: ADENO_DUCTAL,     es: "Ductal",                en: "Ductal"}
          - {code: NEUROENDOCRINO,   es: "Neuroendocrino",        en: "Neuroendocrine"}
          - {code: OTRO,             es: "Otro",                  en: "Other"}
      - id: gleason
        group: diagnostico
        code: GLEASON
        type: select
        required: false
        label_es: "Gleason Score"
        label_en: "Gleason Score"
        options:
          - {code: "6_3+3", es: "6 (3+3)", en: "6 (3+3)"}
          - {code: "7_3+4", es: "7 (3+4)", en: "7 (3+4)"}
          - {code: "7_4+3", es: "7 (4+3)", en: "7 (4+3)"}
          - {code: "8_4+4", es: "8 (4+4)", en: "8 (4+4)"}
          - {code: "9_4+5", es: "9 (4+5)", en: "9 (4+5)"}
          - {code: "9_5+4", es: "9 (5+4)", en: "9 (5+4)"}
          - {code: "10_5+5", es: "10 (5+5)", en: "10 (5+5)"}
      - id: isup
        group: diagnostico
        code: ISUP_GRADE
        type: select
        required: false
        label_es: "Grupo de grado ISUP"
        label_en: "ISUP grade group"
        options:
          - {code: "1", es: "1", en: "1"}
          - {code: "2", es: "2", en: "2"}
          - {code: "3", es: "3", en: "3"}
          - {code: "4", es: "4", en: "4"}
          - {code: "5", es: "5", en: "5"}
      - id: tnm_t
        group: diagnostico
        code: T_STAGE
        type: select
        required: false
        label_es: "T (TNM)"
        label_en: "T stage (TNM)"
        options: [{code: T1a}, {code: T1b}, {code: T1c}, {code: T2a}, {code: T2b},
                  {code: T2c}, {code: T3a}, {code: T3b}, {code: T4}, {code: Tx}]
      - id: tnm_n
        group: diagnostico
        code: N_STAGE
        type: select
        required: false
        label_es: "N (TNM)"
        label_en: "N stage (TNM)"
        options: [{code: N0}, {code: N1}, {code: Nx}]
      - id: tnm_m
        group: diagnostico
        code: M_STAGE
        type: select
        required: false
        label_es: "M (TNM)"
        label_en: "M stage (TNM)"
        options: [{code: M0}, {code: M1a}, {code: M1b}, {code: M1c}, {code: Mx}]
      - id: procedimiento
        group: tratamiento
        code: PROCEDURE
        type: select
        required: false
        label_es: "Procedimiento"
        label_en: "Procedure"
        options:
          - {code: PR_ROBOTICA,         es: "Prostatectomía radical robótica", en: "Robot-assisted radical prostatectomy"}
          - {code: PR_ABIERTA,          es: "Prostatectomía radical abierta",  en: "Open radical prostatectomy"}
          - {code: BRAQUITERAPIA,       es: "Braquiterapia",                   en: "Brachytherapy"}
          - {code: EBRT,                es: "EBRT",                            en: "EBRT"}
          - {code: HORMONOTERAPIA,      es: "Hormonoterapia",                  en: "Hormone therapy"}
          - {code: VIGILANCIA_ACTIVA,   es: "Vigilancia activa",               en: "Active surveillance"}
          - {code: CRIOTERAPIA,         es: "Crioterapia",                     en: "Cryotherapy"}
          - {code: HIFU,                es: "HIFU",                            en: "HIFU"}
          - {code: OTRO,                es: "Otro",                            en: "Other"}
      - *fecha_procedimiento
      - id: margenes
        group: diagnostico
        code: SURGICAL_MARGINS
        type: select
        required: false
        label_es: "Márgenes quirúrgicos"
        label_en: "Surgical margins"
        options:
          - {code: NEGATIVOS,           es: "Negativos",              en: "Negative"}
          - {code: POSITIVOS_FOCALES,   es: "Positivos focales",      en: "Focally positive"}
          - {code: POSITIVOS_EXTENSOS,  es: "Positivos extensos",     en: "Extensively positive"}
          - {code: NO_APLICA,           es: "No aplica",              en: "Not applicable"}
      - id: extension_extraprost
        group: diagnostico
        code: EXTRAPROSTATIC_EXT
        type: select
        required: false
        label_es: "Extensión extraprostática"
        label_en: "Extraprostatic extension"
        options:
          - {code: "NO",        es: "No",        en: "No"}
          - {code: "SI",        es: "Sí",        en: "Yes"}
          - {code: NO_APLICA, es: "No aplica", en: "Not applicable"}
      - id: invasion_vs
        group: diagnostico
        code: SV_INVASION
        type: select
        required: false
        label_es: "Invasión vesículas seminales"
        label_en: "Seminal vesicle invasion"
        options:
          - {code: "NO",        es: "No",        en: "No"}
          - {code: "SI",        es: "Sí",        en: "Yes"}
          - {code: NO_APLICA, es: "No aplica", en: "Not applicable"}
      - id: psa_post
        group: seguimiento
        code: PSA_POSTOP
        type: number
        unit: ng/mL
        required: false
        label_es: "PSA postoperatorio (ng/mL)"
        label_en: "Postoperative PSA (ng/mL)"
      - id: gammagrafia
        group: diagnostico
        code: BONE_SCAN
        type: select
        required: false
        label_es: "Gammagrafía ósea"
        label_en: "Bone scan"
        options:
          - {code: NO_REALIZADA,        es: "No realizada",            en: "Not performed"}
          - {code: SIN_ALTERACIONES,    es: "Sin alteraciones",        en: "Normal"}
          - {code: LESIONES_SOSP,       es: "Lesiones sospechosas",    en: "Suspicious lesions"}
          - {code: METASTASIS_OSEAS,    es: "Metástasis óseas",        en: "Bone metastases"}
      - id: psma_pet
        group: diagnostico
        code: PSMA_PET
        type: select
        required: false
        label_es: "PSMA PET/CT"
        label_en: "PSMA PET/CT"
        options:
          - {code: NO_REALIZADO,        es: "No realizado",             en: "Not performed"}
          - {code: NEGATIVO,            es: "Negativo",                 en: "Negative"}
          - {code: POSITIVO_LOCAL,      es: "Positivo local",           en: "Locally positive"}
          - {code: POSITIVO_GANGLIONAR, es: "Positivo ganglionar",      en: "Nodally positive"}
          - {code: POSITIVO_DISTANCIA,  es: "Positivo a distancia",     en: "Distant positive"}
      - id: estado_actual
        group: seguimiento
        code: CURRENT_STATUS
        type: select
        required: false
        label_es: "Estado actual"
        label_en: "Current status"
        options:
          - {code: LIBRE_ENFERMEDAD,    es: "Libre de enfermedad",       en: "No evidence of disease"}
          - {code: REC_BIOQUIMICA,      es: "Recurrencia bioquímica",    en: "Biochemical recurrence"}
          - {code: RECURRENCIA_LOCAL,   es: "Recurrencia local",         en: "Local recurrence"}
          - {code: METASTASIS,          es: "Metástasis",                en: "Metastatic"}
          - {code: RESISTENTE_CASTRACION, es: "Resistente a castración", en: "Castration-resistant"}
          - {code: FALLECIDO,           es: "Fallecido",                 en: "Deceased"}
      - id: psa_seguimiento
        group: seguimiento
        code: PSA_FU
        type: number
        unit: ng/mL
        required: false
        label_es: "PSA en seguimiento (ng/mL)"
        label_en: "Follow-up PSA (ng/mL)"
      - *proximo_seguimiento
      - *observaciones

  # ===========================================================================
  vejiga:
    nombre_es: "Cáncer de Vejiga"
    nombre_en: "Bladder Cancer"
    cie10: C67
    color: "#8e44ad"
    fields:
      - *fecha_diagnostico
      - id: histologia
        group: diagnostico
        code: HISTOLOGY
        type: select
        required: false
        label_es: "Histología"
        label_en: "Histology"
        options:
          - {code: CARCINOMA_UROTELIAL, es: "Carcinoma urotelial",          en: "Urothelial carcinoma"}
          - {code: ESCAMOCELULAR,       es: "Carcinoma escamocelular",      en: "Squamous cell carcinoma"}
          - {code: ADENOCARCINOMA,      es: "Adenocarcinoma",               en: "Adenocarcinoma"}
          - {code: CELULAS_PEQUENAS,    es: "Carcinoma de células pequeñas", en: "Small cell carcinoma"}
          - {code: OTRO,                es: "Otro",                         en: "Other"}
      - id: grado_who
        group: diagnostico
        code: WHO_GRADE
        type: select
        required: false
        label_es: "Grado WHO 2004"
        label_en: "WHO 2004 grade"
        options:
          - {code: BAJO_GRADO, es: "Bajo grado", en: "Low grade"}
          - {code: ALTO_GRADO, es: "Alto grado", en: "High grade"}
      - id: invasion_muscular
        group: diagnostico
        code: MIBC
        type: boolean
        required: false
        label_es: "Invasión muscular (MIBC)"
        label_en: "Muscle invasion (MIBC)"
      # ---- Approved addition #3: CIS recording (ENCR/COSD urothelial std) ----
      - id: cis_asociado
        group: diagnostico
        code: ASSOCIATED_CIS
        type: boolean
        required: false
        label_es: "Carcinoma in situ asociado"
        label_en: "Associated carcinoma in situ"
      - id: tnm_t
        group: diagnostico
        code: T_STAGE
        type: select
        required: false
        label_es: "T (TNM)"
        label_en: "T stage (TNM)"
        options: [{code: Ta}, {code: Tis}, {code: T1}, {code: T2a}, {code: T2b},
                  {code: T3a}, {code: T3b}, {code: T4a}, {code: T4b}, {code: Tx}]
      - id: tnm_n
        group: diagnostico
        code: N_STAGE
        type: select
        required: false
        label_es: "N (TNM)"
        label_en: "N stage (TNM)"
        options: [{code: N0}, {code: N1}, {code: N2}, {code: N3}, {code: Nx}]
      - id: tnm_m
        group: diagnostico
        code: M_STAGE
        type: select
        required: false
        label_es: "M (TNM)"
        label_en: "M stage (TNM)"
        options: [{code: M0}, {code: M1a}, {code: M1b}, {code: Mx}]
      - id: procedimiento
        group: tratamiento
        code: PROCEDURE
        type: select
        required: false
        label_es: "Procedimiento"
        label_en: "Procedure"
        options:
          - {code: RTU_VEJIGA,          es: "RTU vejiga",                 en: "TURBT"}
          - {code: CISTECTOMIA_RADICAL, es: "Cistectomía radical",        en: "Radical cystectomy"}
          - {code: CISTECTOMIA_PARCIAL, es: "Cistectomía parcial",        en: "Partial cystectomy"}
          - {code: BCG_INTRAVESICAL,    es: "QT intravesical BCG",        en: "Intravesical BCG"}
          - {code: QT_SISTEMICA,        es: "Quimioterapia sistémica",    en: "Systemic chemotherapy"}
          - {code: INMUNOTERAPIA,       es: "Inmunoterapia",              en: "Immunotherapy"}
          - {code: RADIOTERAPIA,        es: "Radioterapia",               en: "Radiotherapy"}
          - {code: OTRO,                es: "Otro",                       en: "Other"}
      - *fecha_procedimiento
      - id: derivacion
        group: tratamiento
        code: URINARY_DIVERSION
        type: select
        required: false
        label_es: "Derivación urinaria"
        label_en: "Urinary diversion"
        options:
          - {code: NO_APLICA,             es: "No aplica",               en: "Not applicable"}
          - {code: CONDUCTO_ILEAL,        es: "Conducto ileal",          en: "Ileal conduit"}
          - {code: NEOVEJIGA_ORTOTOPICA,  es: "Neovejiga ortotópica",    en: "Orthotopic neobladder"}
          - {code: URETEROSTOMIA_CUTANEA, es: "Ureterostomía cutánea",   en: "Cutaneous ureterostomy"}
      - id: recurrencia_previa
        group: seguimiento
        code: PRIOR_RECURRENCE
        type: boolean
        required: false
        label_es: "Recurrencia previa"
        label_en: "Prior recurrence"
      - id: num_recurrencias
        group: seguimiento
        code: RECURRENCE_COUNT
        type: number
        required: false
        label_es: "Número de recurrencias"
        label_en: "Number of recurrences"
      - id: tac_torax_abdomen
        group: diagnostico
        code: CT_TAP
        type: select
        required: false
        label_es: "TAC tórax/abdomen/pelvis"
        label_en: "CT chest/abdomen/pelvis"
        options:
          - {code: NO_REALIZADO,     es: "No realizado",     en: "Not performed"}
          - {code: SIN_ALTERACIONES, es: "Sin alteraciones", en: "Normal"}
          - {code: ADENOPATIAS,      es: "Adenopatías",      en: "Adenopathy"}
          - {code: METASTASIS,       es: "Metástasis",       en: "Metastases"}
          - {code: HIDRONEFROSIS,    es: "Hidronefrosis",    en: "Hydronephrosis"}
          - {code: OTRO,             es: "Otro",             en: "Other"}
      - id: cistoscopia_seguimiento
        group: seguimiento
        code: FU_CYSTOSCOPY
        type: select
        required: false
        label_es: "Cistoscopia de seguimiento"
        label_en: "Follow-up cystoscopy"
        options:
          - {code: NO_REALIZADA,     es: "No realizada",       en: "Not performed"}
          - {code: SIN_RECURRENCIA,  es: "Sin recurrencia",    en: "No recurrence"}
          - {code: RECURRENCIA_TA,   es: "Recurrencia Ta",     en: "Ta recurrence"}
          - {code: RECURRENCIA_T1,   es: "Recurrencia T1",     en: "T1 recurrence"}
          - {code: RECURRENCIA_T2,   es: "Recurrencia T2+",    en: "T2+ recurrence"}
      - id: estado_actual
        group: seguimiento
        code: CURRENT_STATUS
        type: select
        required: false
        label_es: "Estado actual"
        label_en: "Current status"
        options:
          - {code: LIBRE_ENFERMEDAD,  es: "Libre de enfermedad", en: "No evidence of disease"}
          - {code: RECURRENCIA,       es: "Recurrencia",         en: "Recurrence"}
          - {code: PROGRESION,        es: "Progresión",          en: "Progression"}
          - {code: METASTASIS,        es: "Metástasis",          en: "Metastatic"}
          - {code: FALLECIDO,         es: "Fallecido",           en: "Deceased"}
      - *proximo_seguimiento
      - *observaciones

  # ===========================================================================
  rinon:
    nombre_es: "Cáncer de Riñón"
    nombre_en: "Kidney Cancer"
    cie10: C64
    color: "#27ae60"
    fields:
      - *lateralidad
      - *tamano
      # ---- Approved addition #4: presentation mode (renal registry item) -----
      - id: forma_presentacion
        group: diagnostico
        code: PRESENTATION
        type: select
        required: false
        label_es: "Forma de presentación"
        label_en: "Presentation"
        options:
          - {code: INCIDENTAL,  es: "Incidental",  en: "Incidental"}
          - {code: SINTOMATICO, es: "Sintomático", en: "Symptomatic"}
      - *fecha_diagnostico
      - id: histologia
        group: diagnostico
        code: HISTOLOGY
        type: select
        required: false
        label_es: "Histología"
        label_en: "Histology"
        options:
          - {code: CELULAS_CLARAS,     es: "Células claras",            en: "Clear cell"}
          - {code: PAPILAR_TIPO1,      es: "Papilar tipo 1",            en: "Papillary type 1"}
          - {code: PAPILAR_TIPO2,      es: "Papilar tipo 2",            en: "Papillary type 2"}
          - {code: CROMOFOBO,          es: "Cromófobo",                 en: "Chromophobe"}
          - {code: ONCOCITOMA,         es: "Oncocitoma",                en: "Oncocytoma"}
          - {code: CONDUCTOS_COLECTORES, es: "Conductos colectores",    en: "Collecting duct carcinoma"}
          - {code: TRANSLOCACION_XP11, es: "Translocación Xp11",        en: "Xp11 translocation"}
          - {code: OTRO,               es: "Otro",                      en: "Other"}
      - id: grado_isup
        group: diagnostico
        code: ISUP_GRADE
        type: select
        required: false
        label_es: "Grado ISUP/Fuhrman"
        label_en: "ISUP/Fuhrman grade"
        options: [{code: G1}, {code: G2}, {code: G3}, {code: G4}]
      - id: tnm_t
        group: diagnostico
        code: T_STAGE
        type: select
        required: false
        label_es: "T (TNM)"
        label_en: "T stage (TNM)"
        options: [{code: T1a}, {code: T1b}, {code: T2a}, {code: T2b}, {code: T3a},
                  {code: T3b}, {code: T3c}, {code: T4}, {code: Tx}]
      - id: tnm_n
        group: diagnostico
        code: N_STAGE
        type: select
        required: false
